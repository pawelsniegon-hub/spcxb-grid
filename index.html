<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SPCXB Grid</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #0d1117;

    color: #e6edf3;

    font-family:
        Arial,
        sans-serif;
}


.container {

    max-width: 900px;

    margin: 35px auto;

    padding: 20px;
}


.header {

    text-align: center;

    margin-bottom: 30px;
}


.header h1 {

    margin: 0;

    font-size: 32px;
}


.price {

    font-size: 44px;

    font-weight: bold;

    margin-top: 10px;
}


.status {

    margin-top: 8px;

    color: #3fb950;
}


.status.error {

    color: #f85149;
}


.grid {

    background: #161b22;

    border: 1px solid #30363d;

    border-radius: 12px;

    padding: 20px;
}


.level {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 14px 18px;

    margin: 8px 0;

    border-radius: 8px;

    background: #21262d;

    font-size: 18px;
}


.buy {

    border-left:
        5px solid #f85149;
}


.sell {

    border-left:
        5px solid #3fb950;
}


.current {

    border:
        2px solid #58a6ff;

    background: #1f2937;

    font-weight: bold;
}


.type-buy {

    color: #f85149;
}


.type-sell {

    color: #3fb950;
}


.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 20px;
}


.stat {

    background: #161b22;

    border:
        1px solid #30363d;

    border-radius: 10px;

    padding: 18px;

    text-align: center;
}


.stat-title {

    color: #8b949e;

    font-size: 14px;

    margin-bottom: 8px;
}


.stat-value {

    font-size: 20px;

    font-weight: bold;
}


.last-update {

    text-align: center;

    color: #8b949e;

    margin-top: 20px;

    font-size: 13px;
}


@media (max-width: 600px) {

    .container {

        margin: 10px auto;

        padding: 10px;
    }


    .stats {

        grid-template-columns: 1fr;
    }


    .price {

        font-size: 34px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">


        <h1>
            SPCXB / USDT
        </h1>


        <div
            class="price"
            id="currentPrice"
        >
            Ładowanie...
        </div>


        <div
            class="status"
            id="status"
        >
            ● Łączenie z BingX...
        </div>


    </div>



    <div
        class="grid"
        id="grid"
    >

        <!--
            Poziomy siatki
            zostaną utworzone
            automatycznie
        -->

    </div>



    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                Krok siatki
            </div>

            <div class="stat-value">
                4%
            </div>

        </div>



        <div class="stat">

            <div class="stat-title">
                Najbliższy BUY
            </div>

            <div
                class="stat-value"
                id="nearestBuy"
            >
                ---
            </div>

        </div>



        <div class="stat">

            <div class="stat-title">
                Najbliższy SELL
            </div>

            <div
                class="stat-value"
                id="nearestSell"
            >
                ---
            </div>

        </div>


    </div>



    <div
        class="last-update"
        id="lastUpdate"
    >
        Oczekiwanie na dane...
    </div>


</div>



<script>


/*
==================================================
USTAWIENIA
==================================================
*/


const GRID_STEP = 0.04;


/*
Ile poziomów BUY
*/


const LEVELS_BELOW = 6;


/*
Ile poziomów SELL
*/


const LEVELS_ABOVE = 2;



/*
==================================================
POBIERANIE CENY
==================================================

Przeglądarka nie łączy się bezpośrednio
z BingX.

Pyta nasz Cloudflare:

/api/price

Cloudflare pobiera cenę z BingX.
*/


async function getPrice() {


    const response = await fetch(

        "/api/price",

        {
            cache: "no-store"
        }

    );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const json =
        await response.json();


    if (
        !json.price ||
        isNaN(json.price)
    ) {

        throw new Error(
            "Brak ceny"
        );

    }


    return Number(
        json.price
    );

}



/*
==================================================
GENEROWANIE SIATKI
==================================================
*/


function createGrid(price) {


    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML = "";



    /*
    ==============================================
    SELL
    ==============================================
    */


    for (
        let i = LEVELS_ABOVE;
        i >= 1;
        i--
    ) {


        const level =
            price *
            Math.pow(
                1 + GRID_STEP,
                i
            );


        addLevel(

            grid,

            "SELL",

            level,

            "+" +
            (i * 4) +
            "%"

        );

    }



    /*
    ==============================================
    AKTUALNA CENA
    ==============================================
    */


    const current =
        document.createElement(
            "div"
        );


    current.className =
        "level current";


    current.innerHTML = `

        <span>
            ● TERAZ
        </span>

        <strong>
            ${formatPrice(price)}
            USDT
        </strong>

        <span>
            ---
        </span>

    `;


    grid.appendChild(
        current
    );



    /*
    ==============================================
    BUY
    ==============================================
    */


    for (
        let i = 1;
        i <= LEVELS_BELOW;
        i++
    ) {


        const level =
            price *
            Math.pow(
                1 - GRID_STEP,
                i
            );


        addLevel(

            grid,

            "BUY",

            level,

            "-" +
            (i * 4) +
            "%"

        );

    }



    /*
    ==============================================
    NAJBLIŻSZY BUY
    ==============================================
    */


    const nearestBuy =
        price *
        (1 - GRID_STEP);


    document.getElementById(
        "nearestBuy"
    ).textContent =
        formatPrice(
            nearestBuy
        );



    /*
    ==============================================
    NAJBLIŻSZY SELL
    ==============================================
    */


    const nearestSell =
        price *
        (1 + GRID_STEP);


    document.getElementById(
        "nearestSell"
    ).textContent =
        formatPrice(
            nearestSell
        );

}



/*
==================================================
DODANIE POZIOMU
==================================================
*/


function addLevel(

    grid,

    type,

    price,

    percentage

) {


    const level =
        document.createElement(
            "div"
        );


    level.className =
        "level " +
        (
            type === "BUY"
                ? "buy"
                : "sell"
        );


    level.innerHTML = `

        <span>
            ${type}
        </span>

        <strong>
            ${formatPrice(price)}
            USDT
        </strong>

        <span
            class="${
                type === "BUY"
                    ? "type-buy"
                    : "type-sell"
            }"
        >
            ${percentage}
        </span>

    `;


    grid.appendChild(
        level
    );

}



/*
==================================================
FORMAT CENY
==================================================
*/


function formatPrice(price) {

    return Number(price)
        .toFixed(2);

}



/*
==================================================
AKTUALIZACJA
==================================================
*/


async function update() {


    const status =
        document.getElementById(
            "status"
        );


    try {


        /*
        Pobierz aktualną cenę
        */


        const price =
            await getPrice();



        /*
        Cena główna
        */


        document.getElementById(
            "currentPrice"
        ).textContent =

            formatPrice(price)
            +
            " USDT";



        /*
        Utwórz siatkę
        */


        createGrid(
            price
        );



        /*
        Status
        */


        status.textContent =
            "● ONLINE — BingX";


        status.className =
            "status";



        /*
        Czas aktualizacji
        */


        const now =
            new Date();


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Ostatnia aktualizacja: "
            +
            now.toLocaleTimeString();




    } catch (error) {


        console.error(
            error
        );


        status.textContent =
            "● BŁĄD POŁĄCZENIA Z BINGX";


        status.className =
            "status error";


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Nie udało się pobrać ceny.";

    }

}



/*
==================================================
PIERWSZE POBRANIE
==================================================
*/


update();



/*
==================================================
ODŚWIEŻANIE CO 2 SEKUNDY
==================================================
*/


setInterval(

    update,

    2000

);


</script>


</body>

</html>
