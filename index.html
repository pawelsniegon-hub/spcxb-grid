<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPCXB / USDT</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d1117;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 32px;
        }

        .price {
            text-align: center;
            font-size: 46px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status {
            text-align: center;
            margin-top: 8px;
            color: #35d35c;
            font-size: 17px;
        }

        .grid-box {
            margin-top: 28px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
        }

        .level {
            min-height: 64px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr 120px;
            align-items: center;
            padding: 0 14px;
            font-size: 17px;
            font-weight: bold;
            background: #20262e;
            border-left: 5px solid #555;
        }

        .level:last-child {
            margin-bottom: 0;
        }

        .level-label {
            text-align: left;
        }

        .level-price {
            text-align: center;
            font-size: 18px;
        }

        .level-action {
            text-align: right;
        }

        .buy {
            border-left-color: #ff4545;
        }

        .buy .level-label {
            color: #ff4545;
        }

        .sell {
            border-left-color: #32c85b;
        }

        .sell .level-label {
            color: #32c85b;
        }

        .base {
            border-left-color: #e7a900;
            background: #2b271a;
        }

        .base .level-label {
            color: #e7a900;
        }

        .base .level-price {
            color: #ffffff;
        }

        .base-badge {
            color: #e7a900;
            font-size: 13px;
            margin-left: 5px;
        }

        button {
            background: #303740;
            border: 1px solid #4b5560;
            color: white;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        button:hover {
            background: #3c4652;
        }

        .live {
            border: 2px solid #4095ff;
            background: #202b3b;
        }

        .live .level-label {
            color: #4095ff;
        }

        .live-price {
            color: #ffffff;
        }

        .chart-box {
            margin-top: 25px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
        }

        .chart-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chart-status {
            text-align: center;
            color: #35d35c;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px 8px 35px;
            }

            h1 {
                font-size: 25px;
            }

            .price {
                font-size: 35px;
            }

            .status {
                font-size: 15px;
            }

            .grid-box {
                padding: 10px;
            }

            .level {
                min-height: 58px;
                grid-template-columns: 1fr 1fr 95px;
                padding: 0 9px;
                font-size: 14px;
            }

            .level-price {
                font-size: 15px;
            }

            button {
                padding: 7px 7px;
                font-size: 10px;
            }

            .chart-container {
                height: 320px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>SPCXB / USDT</h1>

    <div id="currentPrice" class="price">
        --.-- USDT
    </div>

    <div id="status" class="status">
        ● Łączenie z BingX...
    </div>


    <div class="grid-box">

        <div id="grid"></div>

    </div>


    <div class="chart-box">

        <div class="chart-title">
            SPCXB — HISTORIA 30 DNI
        </div>

        <div id="chartStatus" class="chart-status">
            ● Ładowanie historii BingX...
        </div>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

    </div>

</div>


<script>

    /*
        STAŁE POZIOMY GRIDU

        CENY SIĘ NIGDY NIE ZMIENIAJĄ.

        Po wybraniu nowej bazy:
        - wszystko powyżej bazy = SELL
        - baza = BAZA
        - wszystko poniżej bazy = BUY
    */

    const GRID_LEVELS = [

        { price: 172.27 },
        { price: 165.86 },
        { price: 159.29 },
        { price: 153.00 },
        { price: 146.73 },
        { price: 140.70 },
        { price: 135.10 },
        { price: 129.33 },
        { price: 123.73 },
        { price: 118.75 },
        { price: 113.52 },
        { price: 108.38 }

    ];


    /*
        DOMYŚLNA BAZA
    */

    let selectedBase =
        localStorage.getItem("spcxb_base") || "159.29";


    /*
        SPRAWDZAMY, CZY ZAPISANA BAZA
        FAKTYCZNIE ISTNIEJE NA LIŚCIE.
    */

    const validBase =
        GRID_LEVELS.some(
            level =>
                Number(level.price).toFixed(2) ===
                Number(selectedBase).toFixed(2)
        );


    if (!validBase) {

        selectedBase = "159.29";

        localStorage.setItem(
            "spcxb_base",
            selectedBase
        );

    }


    /*
        ZMIENNA NA AKTUALNĄ CENĘ
    */

    window.lastPrice = null;


    /*
        ZMIENNA NA DANE WYKRESU
    */

    window.chartData = null;


    /*
        OBIEKT WYKRESU
    */

    let priceChart = null;


    /*
        FORMATOWANIE CENY
    */

    function formatPrice(price) {

        return Number(price).toFixed(2);

    }


    /*
        USTALAMY TYP POZIOMU
    */

    function getLevelType(price) {

        const p =
            Number(price);

        const base =
            Number(selectedBase);


        if (
            Math.abs(p - base) < 0.001
        ) {

            return "BASE";

        }


        if (p > base) {

            return "SELL";

        }


        return "BUY";

    }


    /*
        USTAWIENIE NOWEJ BAZY
    */

    function setBase(price) {

        selectedBase =
            Number(price).toFixed(2);


        localStorage.setItem(
            "spcxb_base",
            selectedBase
        );


        /*
            OD RAZU PRZELICZAMY
            WSZYSTKIE POZIOMY
        */

        renderGrid(
            window.lastPrice
        );


        /*
            OD RAZU AKTUALIZUJEMY WYKRES
        */

        if (window.chartData) {

            drawChart(
                window.chartData
            );

        }

    }


    /*
        RYSOWANIE GRIDU
    */

    function renderGrid(currentPrice) {

        const grid =
            document.getElementById("grid");


        grid.innerHTML = "";


        /*
            SORTUJEMY OD NAJWYŻSZEJ CENY
        */

        const levels =
            [...GRID_LEVELS].sort(
                (a, b) =>
                    b.price - a.price
            );


        let insertedLive =
            false;


        for (const level of levels) {

            /*
                JEŚLI AKTUALNA CENA JEST
                POMIĘDZY POZIOMAMI,
                WSTAWIAMY LIVE.
            */

            if (
                currentPrice !== null &&
                !insertedLive &&
                currentPrice > level.price
            ) {

                addLivePrice(
                    grid,
                    currentPrice
                );

                insertedLive = true;

            }


            addGridLevel(
                grid,
                level.price
            );

        }


        /*
            JEŚLI LIVE JEST PONIŻEJ
            NAJNIŻSZEGO POZIOMU
        */

        if (
            currentPrice !== null &&
            !insertedLive
        ) {

            addLivePrice(
                grid,
                currentPrice
            );

        }

    }


    /*
        DODAWANIE POZIOMU GRIDU
    */

    function addGridLevel(
        container,
        price
    ) {

        const type =
            getLevelType(price);


        const row =
            document.createElement("div");


        row.className =
            "level " +
            (
                type === "BUY"
                    ? "buy"
                    : type === "SELL"
                        ? "sell"
                        : "base"
            );


        /*
            LEWA CZĘŚĆ
        */

        const label =
            document.createElement("div");


        label.className =
            "level-label";


        label.textContent =
            type === "BASE"
                ? "BAZA"
                : type;


        /*
            ŚRODEK — CENA
        */

        const priceElement =
            document.createElement("div");


        priceElement.className =
            "level-price";


        priceElement.textContent =
            formatPrice(price) +
            " USDT";


        /*
            PRAWA CZĘŚĆ
        */

        const action =
            document.createElement("div");


        action.className =
            "level-action";


        if (type === "BASE") {

            const badge =
                document.createElement("span");


            badge.className =
                "base-badge";


            badge.textContent =
                "★ BAZA";


            action.appendChild(
                badge
            );

        } else {

            const button =
                document.createElement("button");


            button.textContent =
                "USTAW BAZĘ";


            button.onclick =
                function () {

                    setBase(price);

                };


            action.appendChild(
                button
            );

        }


        row.appendChild(
            label
        );

        row.appendChild(
            priceElement
        );

        row.appendChild(
            action
        );


        container.appendChild(
            row
        );

    }


    /*
        DODAWANIE AKTUALNEJ CENY
    */

    function addLivePrice(
        container,
        price
    ) {

        const row =
            document.createElement("div");


        row.className =
            "level live";


        const label =
            document.createElement("div");


        label.className =
            "level-label";


        label.innerHTML =
            "●<br>TERAZ";


        const priceElement =
            document.createElement("div");


        priceElement.className =
            "level-price live-price";


        priceElement.textContent =
            formatPrice(price) +
            " USDT";


        const action =
            document.createElement("div");


        action.className =
            "level-action";


        action.textContent =
            "LIVE";


        row.appendChild(
            label
        );

        row.appendChild(
            priceElement
        );

        row.appendChild(
            action
        );


        container.appendChild(
            row
        );

    }


    /*
        POBIERANIE AKTUALNEJ CENY
    */

    async function updatePrice() {

        try {

            const response =
                await fetch(
                    "/api/price?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !data.price ||
                !Number.isFinite(
                    Number(data.price)
                )
            ) {

                throw new Error(
                    "Brak poprawnej ceny"
                );

            }


            const price =
                Number(data.price);


            window.lastPrice =
                price;


            document.getElementById(
                "currentPrice"
            ).textContent =
                formatPrice(price) +
                " USDT";


            document.getElementById(
                "status"
            ).textContent =
                "● ONLINE — BingX";


            renderGrid(
                price
            );


            /*
                AKTUALIZUJEMY NIEBIESKĄ LINIĘ
                NA WYKRESIE
            */

            if (
                window.chartData
            ) {

                drawChart(
                    window.chartData
                );

            }

        } catch (error) {

            document.getElementById(
                "status"
            ).textContent =
                "● BŁĄD POŁĄCZENIA Z BINGX";

        }

    }


    /*
        POBIERANIE HISTORII
    */

    async function loadChart() {

        try {

            document.getElementById(
                "chartStatus"
            ).textContent =
                "● Ładowanie historii BingX...";


            const response =
                await fetch(
                    "/api/klines?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data) ||
                data.length === 0
            ) {

                throw new Error(
                    "Brak danych"
                );

            }


            window.chartData =
                data;


            drawChart(
                data
            );


            document.getElementById(
                "chartStatus"
            ).textContent =
                "● HISTORIA BINGX";


        } catch (error) {

            document.getElementById(
                "chartStatus"
            ).textContent =
                "● BŁĄD HISTORII BINGX";

        }

    }


    /*
        RYSOWANIE WYKRESU
    */

    function drawChart(data) {

        const canvas =
            document.getElementById(
                "priceChart"
            );


        /*
            CENY Z HISTORII
        */

        const historyPrices =
            data
                .map(
                    item =>
                        Number(item.close)
                )
                .filter(
                    value =>
                        Number.isFinite(value)
                );


        /*
            WSZYSTKIE POZIOMY GRIDU
        */

        const gridPrices =
            GRID_LEVELS.map(
                level =>
                    Number(level.price)
            );


        /*
            USTALAMY MIN/MAX
            Z CAŁEGO GRIDU + HISTORII
        */

        let minPrice =
            Math.min(
                ...gridPrices,
                ...historyPrices
            );


        let maxPrice =
            Math.max(
                ...gridPrices,
                ...historyPrices
            );


        /*
            DODAJEMY AKTUALNĄ CENĘ
        */

        if (
            window.lastPrice !== null
        ) {

            minPrice =
                Math.min(
                    minPrice,
                    Number(
                        window.lastPrice
                    )
                );


            maxPrice =
                Math.max(
                    maxPrice,
                    Number(
                        window.lastPrice
                    )
                );

        }


        /*
            5% MARGINESU
        */

        const padding =
            (maxPrice - minPrice) *
            0.05;


        minPrice -=
            padding;


        maxPrice +=
            padding;


        /*
            ETYKIETY CZASU
        */

        const labels =
            data.map(
                item =>
                    new Date(
                        Number(item.time)
                    ).toLocaleDateString(
                        "pl-PL",
                        {
                            day: "2-digit",
                            month: "2-digit"
                        }
                    )
            );


        /*
            CENY HISTORII
        */

        const historyData =
            data.map(
                item =>
                    Number(item.close)
            );


        /*
            DATASETY
        */

        const datasets = [

            {
                label:
                    "SPCXB",

                data:
                    historyData,

                borderColor:
                    "#8b949e",

                backgroundColor:
                    "rgba(139,148,158,0.08)",

                borderWidth:
                    2,

                pointRadius:
                    0,

                tension:
                    0.15,

                fill:
                    true
            }

        ];


        /*
            DODAJEMY KAŻDY POZIOM GRIDU
        */

        GRID_LEVELS.forEach(
            level => {

                const type =
                    getLevelType(
                        level.price
                    );


                let lineColor;


                if (
                    type === "BUY"
                ) {

                    lineColor =
                        "#ff4545";

                } else if (
                    type === "SELL"
                ) {

                    lineColor =
                        "#32c85b";

                } else {

                    lineColor =
                        "#e7a900";

                }


                datasets.push({

                    label:
                        type === "BASE"
                            ? "BAZA " +
                              formatPrice(
                                  level.price
                              )
                            : type +
                              " " +
                              formatPrice(
                                  level.price
                              ),

                    data:
                        labels.map(
                            () =>
                                level.price
                        ),

                    borderColor:
                        lineColor,

                    borderWidth:
                        type === "BASE"
                            ? 3
                            : 1,

                    pointRadius:
                        0,

                    borderDash:
                        type === "BASE"
                            ? []
                            : [6, 5],

                    fill:
                        false

                });

            }
        );


        /*
            AKTUALNA CENA
        */

        if (
            window.lastPrice !== null
        ) {

            datasets.push({

                label:
                    "TERAZ " +
                    formatPrice(
                        window.lastPrice
                    ),

                data:
                    labels.map(
                        () =>
                            window.lastPrice
                    ),

                borderColor:
                    "#4095ff",

                borderWidth:
                    3,

                pointRadius:
                    0,

                borderDash:
                    [2, 4],

                fill:
                    false

            });

        }


        /*
            JEŚLI STARY WYKRES ISTNIEJE
            — USUWAMY GO
        */

        if (priceChart) {

            priceChart.destroy();

        }


        /*
            TWORZYMY NOWY WYKRES
        */

        priceChart =
            new Chart(
                canvas,
                {

                    type:
                        "line",

                    data: {

                        labels:
                            labels,

                        datasets:
                            datasets

                    },

                    options: {

                        responsive:
                            true,

                        maintainAspectRatio:
                            false,

                        animation:
                            false,

                        interaction: {

                            mode:
                                "index",

                            intersect:
                                false

                        },

                        plugins: {

                            legend: {

                                display:
                                    true,

                                labels: {

                                    color:
                                        "#ffffff",

                                    boxWidth:
                                        18,

                                    font: {

                                        size:
                                            10

                                    }

                                }

                            },

                            tooltip: {

                                enabled:
                                    true

                            }

                        },

                        scales: {

                            x: {

                                ticks: {

                                    color:
                                        "#8b949e",

                                    maxTicksLimit:
                                        10

                                },

                                grid: {

                                    color:
                                        "rgba(255,255,255,0.05)"

                                }

                            },

                            y: {

                                min:
                                    minPrice,

                                max:
                                    maxPrice,

                                ticks: {

                                    color:
                                        "#8b949e",

                                    callback:
                                        function(value) {

                                            return Number(
                                                value
                                            ).toFixed(
                                                2
                                            );

                                        }

                                },

                                grid: {

                                    color:
                                        "rgba(255,255,255,0.08)"

                                }

                            }

                        }

                    }

                }
            );

    }


    /*
        START
    */

    renderGrid(
        null
    );


    updatePrice();


    loadChart();


    /*
        CENA CO 2 SEKUNDY
    */

    setInterval(
        updatePrice,
        2000
    );


    /*
        HISTORIA CO 5 MINUT
    */

    setInterval(
        loadChart,
        5 * 60 * 1000
    );

</script>

</body>
</html>
