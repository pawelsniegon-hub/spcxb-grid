<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SPCXB Grid</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
}


.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 25px;
}


.header h1 {
    margin: 0;
    font-size: 32px;
}


.price {
    font-size: 44px;
    font-weight: bold;
    margin-top: 10px;
}


.status {
    margin-top: 8px;
    color: #3fb950;
}


.status.error {
    color: #f85149;
}


/* =========================
   GRID
========================= */

.grid {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 15px;
}


.level {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 14px;
    margin: 7px 0;

    border-radius: 8px;

    background: #21262d;

    font-size: 17px;
}


.level-left {
    width: 70px;
    flex-shrink: 0;
}


.level-price {
    flex: 1;
    text-align: center;
}


.level-action {
    width: 130px;
    text-align: right;
}


.buy {
    border-left: 5px solid #f85149;
}


.sell {
    border-left: 5px solid #3fb950;
}


.base {
    border-left: 5px solid #d29922;
    background: #2a2518;
}


.current {
    border: 2px solid #58a6ff;
    background: #1f2937;
    font-weight: bold;
}


.type-buy {
    color: #f85149;
}


.type-sell {
    color: #3fb950;
}


.type-base {
    color: #d29922;
    font-weight: bold;
}


.current-label {
    color: #58a6ff;
}


.base-button {
    background: #30363d;
    color: #e6edf3;

    border: 1px solid #484f58;
    border-radius: 6px;

    padding: 7px 9px;

    cursor: pointer;

    font-size: 12px;

    white-space: nowrap;
}


.base-button:hover {
    background: #484f58;
}


.base-button.active {
    background: #9e6a03;
    border-color: #d29922;

    color: white;
    font-weight: bold;
}


.current-base {
    color: #d29922;
    font-weight: bold;
    font-size: 12px;
}


/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 15px;
}


.stat {
    background: #161b22;

    border: 1px solid #30363d;

    border-radius: 10px;

    padding: 15px;

    text-align: center;
}


.stat-title {
    color: #8b949e;

    font-size: 13px;

    margin-bottom: 7px;
}


.stat-value {
    font-size: 19px;

    font-weight: bold;
}


/* =========================
   CHART
========================= */

.chart-box {

    margin-top: 25px;

    background: #161b22;

    border: 1px solid #30363d;

    border-radius: 12px;

    padding: 15px;

}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

}


.chart-title {

    font-size: 18px;

    font-weight: bold;

}


.chart-status {

    font-size: 12px;

    color: #8b949e;

}


.chart-wrapper {

    width: 100%;

    height: 330px;

    position: relative;

}


#chart {

    width: 100%;

    height: 100%;

    display: block;

}


.chart-info {

    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    color: #8b949e;

    font-size: 11px;

}


/* =========================
   UPDATE
========================= */

.last-update {

    text-align: center;

    color: #8b949e;

    margin-top: 18px;

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {

        margin: 5px auto;

        padding: 8px;

    }


    .header h1 {

        font-size: 26px;

    }


    .price {

        font-size: 34px;

    }


    .level {

        font-size: 15px;

        padding: 11px 8px;

        gap: 5px;

    }


    .level-left {

        width: 45px;

    }


    .level-action {

        width: 100px;

    }


    .base-button {

        font-size: 10px;

        padding: 6px 5px;

    }


    .stats {

        grid-template-columns: 1fr;

    }


    .chart-wrapper {

        height: 260px;

    }


    .chart-title {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->


<div class="header">


    <h1>
        SPCXB / USDT
    </h1>


    <div
        class="price"
        id="currentPrice"
    >
        Ładowanie...
    </div>


    <div
        class="status"
        id="status"
    >
        ● Łączenie z BingX...
    </div>


</div>



<!-- =========================
     GRID
========================= -->


<div
    class="grid"
    id="grid"
>

</div>



<!-- =========================
     STATS
========================= -->


<div class="stats">


    <div class="stat">

        <div class="stat-title">
            USTAWIONA BAZA
        </div>

        <div
            class="stat-value"
            id="currentBase"
        >
            ---
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            NAJBLIŻSZY BUY
        </div>

        <div
            class="stat-value"
            id="nearestBuy"
        >
            ---
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            NAJBLIŻSZY SELL
        </div>

        <div
            class="stat-value"
            id="nearestSell"
        >
            ---
        </div>

    </div>


</div>



<!-- =========================
     CHART
========================= -->


<div class="chart-box">


    <div class="chart-header">


        <div class="chart-title">
            SPCXB — OSTATNIE 30 DNI
        </div>


        <div
            class="chart-status"
            id="chartStatus"
        >
            Ładowanie historii...
        </div>


    </div>


    <div class="chart-wrapper">

        <canvas
            id="chart"
        ></canvas>

    </div>


    <div class="chart-info">

        <span id="chartStart">
            ---
        </span>

        <span id="chartEnd">
            ---
        </span>

    </div>


</div>



<!-- =========================
     LAST UPDATE
========================= -->


<div
    class="last-update"
    id="lastUpdate"
>

    Oczekiwanie na dane...

</div>


</div>



<script>


/*
==================================================
STAŁA SIATKA
==================================================

CENY NIGDY NIE SĄ AUTOMATYCZNIE ZMIENIANE.
*/


const GRID_LEVELS = [

    {
        price: 172.27,
        type: "SELL"
    },

    {
        price: 165.86,
        type: "SELL"
    },

    {
        price: 159.29,
        type: "BASE"
    },

    {
        price: 153.00,
        type: "BUY"
    },

    {
        price: 146.73,
        type: "BUY"
    },

    {
        price: 140.70,
        type: "BUY"
    },

    {
        price: 135.10,
        type: "BUY"
    },

    {
        price: 129.33,
        type: "BUY"
    },

    {
        price: 123.73,
        type: "BUY"
    },

    {
        price: 118.75,
        type: "BUY"
    },

    {
        price: 113.52,
        type: "BUY"
    },

    {
        price: 108.38,
        type: "BUY"
    }

];


/*
==================================================
BAZA
==================================================
*/


let selectedBase =
    localStorage.getItem(
        "spcxb_base"
    );


if (
    selectedBase === null
) {

    selectedBase =
        "159.29";

}


/*
==================================================
CENA
==================================================
*/


async function getPrice() {


    const response =
        await fetch(

            "/api/price",

            {
                cache: "no-store"
            }

        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const json =
        await response.json();


    if (
        !json.price ||
        isNaN(json.price)
    ) {

        throw new Error(
            "Brak ceny"
        );

    }


    return Number(
        json.price
    );

}


/*
==================================================
FORMAT CENY
==================================================
*/


function formatPrice(
    price
) {

    return Number(price)
        .toFixed(2);

}


/*
==================================================
USTAW BAZĘ
==================================================
*/


function setBase(
    price
) {


    selectedBase =
        String(price);


    localStorage.setItem(

        "spcxb_base",

        selectedBase

    );


    renderGrid(
        window.lastPrice
    );

}


/*
==================================================
DODAJ POZIOM
==================================================
*/


function addLevel(
    grid,
    level
) {


    const element =
        document.createElement(
            "div"
        );


    const isBase =
        Number(level.price) ===
        Number(selectedBase);


    if (isBase) {

        element.className =
            "level base";

    }

    else if (
        level.type === "SELL"
    ) {

        element.className =
            "level sell";

    }

    else {

        element.className =
            "level buy";

    }


    let leftText =
        level.type;


    if (isBase) {

        leftText =
            "BAZA";

    }


    let buttonHTML;


    if (isBase) {

        buttonHTML = `

            <span class="current-base">
                ★ BAZA
            </span>

        `;

    }

    else {

        buttonHTML = `

            <button
                class="base-button"
                onclick="setBase(${level.price})"
            >
                USTAW BAZĘ
            </button>

        `;

    }


    element.innerHTML = `

        <div class="level-left">

            <span class="${
                level.type === "BUY"
                    ? "type-buy"
                    : "type-sell"
            }">

                ${leftText}

            </span>

        </div>


        <div class="level-price">

            <strong>
                ${formatPrice(level.price)}
                USDT
            </strong>

        </div>


        <div class="level-action">

            ${buttonHTML}

        </div>

    `;


    grid.appendChild(
        element
    );

}


/*
==================================================
AKTUALNA CENA W SIATCE
==================================================
*/


function createCurrentPrice(
    price
) {


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "level current";


    element.innerHTML = `

        <div class="level-left">

            <span class="current-label">
                ● TERAZ
            </span>

        </div>


        <div class="level-price">

            <strong>
                ${formatPrice(price)}
                USDT
            </strong>

        </div>


        <div class="level-action">

            <span>
                LIVE
            </span>

        </div>

    `;


    return element;

}


/*
==================================================
TWORZENIE SIATKI
==================================================
*/


function renderGrid(
    price
) {


    if (
        price === null ||
        price === undefined
    ) {

        return;

    }


    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML = "";


    const levels =
        [...GRID_LEVELS]
            .sort(
                (a, b) =>
                    b.price - a.price
            );


    for (
        let i = 0;
        i < levels.length;
        i++
    ) {


        const level =
            levels[i];


        addLevel(
            grid,
            level
        );


        const nextLevel =
            levels[i + 1];


        if (
            nextLevel &&
            price < level.price &&
            price > nextLevel.price
        ) {


            grid.appendChild(

                createCurrentPrice(
                    price
                )

            );

        }

    }


    if (
        price >
        levels[0].price
    ) {


        grid.insertBefore(

            createCurrentPrice(
                price
            ),

            grid.firstChild

        );

    }


    if (
        price <
        levels[
            levels.length - 1
        ].price
    ) {


        grid.appendChild(

            createCurrentPrice(
                price
            )

        );

    }


    /*
    NAJBLIŻSZY BUY
    */


    const buys =
        levels
            .filter(
                level =>
                    level.type === "BUY" &&
                    level.price < price
            )
            .sort(
                (a, b) =>
                    b.price - a.price
            );


    const nearestBuy =
        buys.length
            ? buys[0].price
            : null;


    document.getElementById(
        "nearestBuy"
    ).textContent =

        nearestBuy !== null
            ? formatPrice(nearestBuy)
            : "---";


    /*
    NAJBLIŻSZY SELL
    */


    const sells =
        levels
            .filter(
                level =>
                    level.type === "SELL" &&
                    level.price > price
            )
            .sort(
                (a, b) =>
                    a.price - b.price
            );


    const nearestSell =
        sells.length
            ? sells[0].price
            : null;


    document.getElementById(
        "nearestSell"
    ).textContent =

        nearestSell !== null
            ? formatPrice(nearestSell)
            : "---";


    /*
    BAZA
    */


    document.getElementById(
        "currentBase"
    ).textContent =

        formatPrice(
            Number(selectedBase)
        ) +
        " USDT";

}


/*
==================================================
AKTUALIZACJA CENY
==================================================
*/


async function update() {


    const status =
        document.getElementById(
            "status"
        );


    try {


        const price =
            await getPrice();


        window.lastPrice =
            price;


        document.getElementById(
            "currentPrice"
        ).textContent =

            formatPrice(price)
            +
            " USDT";


        renderGrid(
            price
        );


        status.textContent =
            "● ONLINE — BingX";


        status.className =
            "status";


        const now =
            new Date();


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Ostatnia aktualizacja: "
            +
            now.toLocaleTimeString();

    }


    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "● BŁĄD POŁĄCZENIA Z BINGX";


        status.className =
            "status error";


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Nie udało się pobrać ceny.";

    }

}


/*
==================================================
HISTORIA 30 DNI
==================================================
*/


async function getHistory() {


    const response =
        await fetch(

            "/api/klines",

            {
                cache: "no-store"
            }

        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        !data ||
        !Array.isArray(data)
    ) {

        throw new Error(
            "Brak historii"
        );

    }


    return data;

}


/*
==================================================
RYSOWANIE WYKRESU
==================================================
*/


function drawChart(
    data
) {


    const canvas =
        document.getElementById(
            "chart"
        );


    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio ||
        1;


    canvas.width =
        rect.width * dpr;


    canvas.height =
        rect.height * dpr;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.scale(
        dpr,
        dpr
    );


    const width =
        rect.width;


    const height =
        rect.height;


    /*
    MARGINESY
    */


    const left =
        48;


    const right =
        12;


    const top =
        15;


    const bottom =
        28;


    const chartWidth =
        width -
        left -
        right;


    const chartHeight =
        height -
        top -
        bottom;


    /*
    CENY
    */


    const prices =
        data.map(
            item =>
                Number(item.close)
        );


    let minPrice =
        Math.min(
            ...prices
        );


    let maxPrice =
        Math.max(
            ...prices
        );


    /*
    Dodajemy trochę miejsca
    nad i pod wykresem.
    */


    const padding =
        (maxPrice - minPrice)
        * 0.08;


    minPrice -=
        padding;


    maxPrice +=
        padding;


    /*
    TŁO
    */


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    SIATKA POZIOMA
    */


    ctx.strokeStyle =
        "#30363d";


    ctx.lineWidth =
        1;


    ctx.font =
        "11px Arial";


    ctx.fillStyle =
        "#8b949e";


    const gridCount =
        5;


    for (
        let i = 0;
        i <= gridCount;
        i++
    ) {


        const y =
            top +
            (
                chartHeight *
                i /
                gridCount
            );


        ctx.beginPath();


        ctx.moveTo(
            left,
            y
        );


        ctx.lineTo(
            width - right,
            y
        );


        ctx.stroke();


        const value =
            maxPrice -
            (
                (
                    maxPrice -
                    minPrice
                )
                *
                i /
                gridCount
            );


        ctx.fillText(

            value.toFixed(2),

            5,

            y + 4

        );

    }


    /*
    LINIE SIATKI TRADINGOWEJ
    */


    GRID_LEVELS.forEach(
        level => {


            if (
                level.price < minPrice ||
                level.price > maxPrice
            ) {

                return;

            }


            const y =
                top +
                (
                    (
                        maxPrice -
                        level.price
                    )
                    /
                    (
                        maxPrice -
                        minPrice
                    )
                )
                *
                chartHeight;


            ctx.setLineDash(
                [5, 5]
            );


            ctx.lineWidth =
                1;


            if (
                level.type === "BUY"
            ) {

                ctx.strokeStyle =
                    "rgba(248,81,73,0.45)";

            }

            else {

                ctx.strokeStyle =
                    "rgba(63,185,80,0.45)";

            }


            ctx.beginPath();


            ctx.moveTo(
                left,
                y
            );


            ctx.lineTo(
                width - right,
                y
            );


            ctx.stroke();


            ctx.setLineDash([]);


            ctx.fillStyle =
                level.type === "BUY"
                    ? "#f85149"
                    : "#3fb950";


            ctx.fillText(

                level.price.toFixed(2),

                width - 44,

                y - 4

            );

        }
    );


    /*
    LINIA CENY
    */


    ctx.beginPath();


    data.forEach(
        (item, index) => {


            const x =
                left +
                (
                    index /
                    (
                        data.length - 1
                    )
                )
                *
                chartWidth;


            const y =
                top +
                (
                    (
                        maxPrice -
                        Number(item.close)
                    )
                    /
                    (
                        maxPrice -
                        minPrice
                    )
                )
                *
                chartHeight;


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#58a6ff";


    ctx.lineWidth =
        2;


    ctx.stroke();


    /*
    AKTUALNA CENA
    */


    if (
        window.lastPrice
    ) {


        const current =
            Number(
                window.lastPrice
            );


        if (
            current >= minPrice &&
            current <= maxPrice
        ) {


            const y =
                top +
                (
                    (
                        maxPrice -
                        current
                    )
                    /
                    (
                        maxPrice -
                        minPrice
                    )
                )
                *
                chartHeight;


            ctx.setLineDash(
                [4, 4]
            );


            ctx.strokeStyle =
                "#58a6ff";


            ctx.lineWidth =
                1;


            ctx.beginPath();


            ctx.moveTo(
                left,
                y
            );


            ctx.lineTo(
                width - right,
                y
            );


            ctx.stroke();


            ctx.setLineDash([]);


            ctx.fillStyle =
                "#58a6ff";


            ctx.font =
                "bold 11px Arial";


            ctx.fillText(

                current.toFixed(2),

                width - 44,

                y - 5

            );

        }

    }

}


/*
==================================================
ŁADOWANIE HISTORII
==================================================
*/


async function loadChart() {


    const status =
        document.getElementById(
            "chartStatus"
        );


    try {


        const data =
            await getHistory();


        if (
            data.length < 2
        ) {

            throw new Error(
                "Za mało danych"
            );

        }


        window.chartData =
            data;


        drawChart(
            data
        );


        /*
        DATY
        */


        const first =
            new Date(
                data[0].time
            );


        const last =
            new Date(
                data[
                    data.length - 1
                ].time
            );


        document.getElementById(
            "chartStart"
        ).textContent =

            first.toLocaleDateString();


        document.getElementById(
            "chartEnd"
        ).textContent =

            last.toLocaleDateString();


        status.textContent =
            "● HISTORIA BINGX";


    }


    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Błąd pobierania historii";

    }

}


/*
==================================================
START
==================================================
*/


update();


loadChart();


/*
==================================================
CENA CO 2 SEKUNDY
==================================================
*/


setInterval(

    update,

    2000

);


/*
==================================================
ODŚWIEŻANIE WYKRESU
==================================================

Co 5 minut pobieramy ponownie
historię.
*/


setInterval(

    loadChart,

    5 * 60 * 1000

);


/*
==================================================
PRZERYWASOWANIE WYKRESU
PO ZMIANIE OKNA
==================================================
*/


window.addEventListener(

    "resize",

    () => {

        if (
            window.chartData
        ) {

            drawChart(
                window.chartData
            );

        }

    }

);

</script>


</body>

</html>
