<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPCXB Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d1117;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .price {
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status {
            color: #3fb950;
            margin-top: 8px;
        }

        .grid {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }

        .level {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: 8px;
            background: #21262d;
            font-size: 18px;
        }

        .buy {
            border-left: 5px solid #f85149;
        }

        .sell {
            border-left: 5px solid #3fb950;
        }

        .current {
            border: 2px solid #58a6ff;
            background: #1f2937;
            font-weight: bold;
        }

        .type-buy {
            color: #f85149;
        }

        .type-sell {
            color: #3fb950;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }

        .stat-title {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .price {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SPCXB / USDT</h1>

        <div class="price">
            159.10 USDT
        </div>

        <div class="status">
            ● ONLINE
        </div>
    </div>

    <div class="grid">

        <div class="level sell">
            <span>SELL</span>
            <strong>172.27 USDT</strong>
            <span class="type-sell">+8%</span>
        </div>

        <div class="level sell">
            <span>SELL</span>
            <strong>165.46 USDT</strong>
            <span class="type-sell">+4%</span>
        </div>

        <div class="level current">
            <span>● TERAZ</span>
            <strong>159.10 USDT</strong>
            <span>---</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>152.74 USDT</strong>
            <span class="type-buy">-4%</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>146.63 USDT</strong>
            <span class="type-buy">-8%</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>140.76 USDT</strong>
            <span class="type-buy">-12%</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>135.13 USDT</strong>
            <span class="type-buy">-16%</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>129.73 USDT</strong>
            <span class="type-buy">-20%</span>
        </div>

        <div class="level buy">
            <span>BUY</span>
            <strong>124.54 USDT</strong>
            <span class="type-buy">-24%</span>
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">Krok siatki</div>
            <div class="stat-value">4%</div>
        </div>

        <div class="stat">
            <div class="stat-title">Najbliższy BUY</div>
            <div class="stat-value">152.74</div>
        </div>

        <div class="stat">
            <div class="stat-title">Najbliższy SELL</div>
            <div class="stat-value">165.46</div>
        </div>

    </div>

</div>

</body>
</html>
