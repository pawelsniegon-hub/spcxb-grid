<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SPCXB Grid</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
}


.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}


.header {
    text-align: center;
    margin-bottom: 25px;
}


.header h1 {
    margin: 0;
    font-size: 32px;
}


.price {
    font-size: 44px;
    font-weight: bold;
    margin-top: 10px;
}


.status {
    margin-top: 8px;
    color: #3fb950;
}


.status.error {
    color: #f85149;
}


.grid {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 15px;
}


.level {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 14px;
    margin: 7px 0;

    border-radius: 8px;

    background: #21262d;

    font-size: 17px;
}


.level-left {
    width: 70px;
    flex-shrink: 0;
}


.level-price {
    flex: 1;
    text-align: center;
}


.level-action {
    width: 130px;
    text-align: right;
}


.buy {
    border-left: 5px solid #f85149;
}


.sell {
    border-left: 5px solid #3fb950;
}


.base {
    border-left: 5px solid #d29922;
    background: #2a2518;
}


.current {
    border: 2px solid #58a6ff;
    background: #1f2937;
    font-weight: bold;
}


.type-buy {
    color: #f85149;
}


.type-sell {
    color: #3fb950;
}


.type-base {
    color: #d29922;
    font-weight: bold;
}


.current-label {
    color: #58a6ff;
}


.base-button {

    background: #30363d;

    color: #e6edf3;

    border: 1px solid #484f58;

    border-radius: 6px;

    padding: 7px 9px;

    cursor: pointer;

    font-size: 12px;

    white-space: nowrap;
}


.base-button:hover {

    background: #484f58;
}


.base-button.active {

    background: #9e6a03;

    border-color: #d29922;

    color: white;

    font-weight: bold;
}


.current-base {

    color: #d29922;

    font-weight: bold;

    font-size: 12px;
}


.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 15px;
}


.stat {

    background: #161b22;

    border: 1px solid #30363d;

    border-radius: 10px;

    padding: 15px;

    text-align: center;
}


.stat-title {

    color: #8b949e;

    font-size: 13px;

    margin-bottom: 7px;
}


.stat-value {

    font-size: 19px;

    font-weight: bold;
}


.last-update {

    text-align: center;

    color: #8b949e;

    margin-top: 18px;

    font-size: 12px;
}


@media (max-width: 600px) {

    .container {

        margin: 5px auto;

        padding: 8px;
    }


    .header h1 {

        font-size: 26px;
    }


    .price {

        font-size: 34px;
    }


    .level {

        font-size: 15px;

        padding: 11px 8px;

        gap: 5px;
    }


    .level-left {

        width: 45px;
    }


    .level-action {

        width: 100px;
    }


    .base-button {

        font-size: 10px;

        padding: 6px 5px;
    }


    .stats {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">


        <h1>
            SPCXB / USDT
        </h1>


        <div
            class="price"
            id="currentPrice"
        >
            Ładowanie...
        </div>


        <div
            class="status"
            id="status"
        >
            ● Łączenie z BingX...
        </div>


    </div>



    <div
        class="grid"
        id="grid"
    >

    </div>



    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                USTAWIONA BAZA
            </div>

            <div
                class="stat-value"
                id="currentBase"
            >
                ---
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                NAJBLIŻSZY BUY
            </div>

            <div
                class="stat-value"
                id="nearestBuy"
            >
                ---
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                NAJBLIŻSZY SELL
            </div>

            <div
                class="stat-value"
                id="nearestSell"
            >
                ---
            </div>

        </div>


    </div>



    <div
        class="last-update"
        id="lastUpdate"
    >
        Oczekiwanie na dane...
    </div>


</div>



<script>


/*
==================================================
STAŁA SIATKA
==================================================

CENY NIGDY NIE SĄ AUTOMATYCZNIE ZMIENIANE.

Możesz tylko oznaczyć jeden z poziomów
jako aktualną BAZĘ.
*/


const GRID_LEVELS = [

    {
        price: 172.27,
        type: "SELL"
    },

    {
        price: 165.86,
        type: "SELL"
    },

    {
        price: 159.29,
        type: "BASE"
    },

    {
        price: 153.00,
        type: "BUY"
    },

    {
        price: 146.73,
        type: "BUY"
    },

    {
        price: 140.70,
        type: "BUY"
    },

    {
        price: 135.10,
        type: "BUY"
    },

    {
        price: 129.33,
        type: "BUY"
    },

    {
        price: 123.73,
        type: "BUY"
    },

    {
        price: 118.75,
        type: "BUY"
    },

    {
        price: 113.52,
        type: "BUY"
    },

    {
        price: 108.38,
        type: "BUY"
    }

];



/*
==================================================
PAMIĘTANIE BAZY
==================================================
*/


let selectedBase =
    localStorage.getItem(
        "spcxb_base"
    );


/*
Jeżeli baza nie istnieje,
domyślnie ustawiamy 159.29
*/


if (
    selectedBase === null
) {

    selectedBase =
        "159.29";

}



/*
==================================================
POBIERANIE CENY Z BINGX
==================================================
*/


async function getPrice() {


    const response =
        await fetch(

            "/api/price",

            {
                cache: "no-store"
            }

        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const json =
        await response.json();


    if (
        !json.price ||
        isNaN(json.price)
    ) {

        throw new Error(
            "Brak ceny"
        );

    }


    return Number(
        json.price
    );

}



/*
==================================================
FORMAT CENY
==================================================
*/


function formatPrice(
    price
) {

    return Number(price)
        .toFixed(2);

}



/*
==================================================
USTAWIANIE NOWEJ BAZY
==================================================
*/


function setBase(
    price
) {


    /*
    Zapamiętujemy tylko wybrany
    poziom.

    NIE ZMIENIAMY ŻADNYCH CEN.
    */


    selectedBase =
        String(price);


    localStorage.setItem(

        "spcxb_base",

        selectedBase

    );


    /*
    Od razu odświeżamy widok.
    */


    renderGrid(
        window.lastPrice
    );

}



/*
==================================================
DODANIE POZIOMU
==================================================
*/


function addLevel(
    grid,
    level
) {


    const element =
        document.createElement(
            "div"
        );


    const isBase =
        Number(level.price) ===
        Number(selectedBase);



    /*
    ==============================================
    KLASA
    ==============================================
    */


    if (isBase) {

        element.className =
            "level base";

    }

    else if (
        level.type === "SELL"
    ) {

        element.className =
            "level sell";

    }

    else {

        element.className =
            "level buy";

    }



    /*
    ==============================================
    LEWA STRONA
    ==============================================
    */


    let leftText =
        level.type;


    if (isBase) {

        leftText =
            "BAZA";

    }



    /*
    ==============================================
    PRZYCISK
    ==============================================
    */


    let buttonHTML;


    if (isBase) {


        buttonHTML = `

            <span class="current-base">
                ★ BAZA
            </span>

        `;

    }

    else {


        buttonHTML = `

            <button
                class="base-button"
                onclick="setBase(${level.price})"
            >
                USTAW BAZĘ
            </button>

        `;

    }



    /*
    ==============================================
    HTML POZIOMU
    ==============================================
    */


    element.innerHTML = `

        <div class="level-left">

            <span class="${
                level.type === "BUY"
                    ? "type-buy"
                    : "type-sell"
            }">

                ${leftText}

            </span>

        </div>


        <div class="level-price">

            <strong>
                ${formatPrice(level.price)}
                USDT
            </strong>

        </div>


        <div class="level-action">

            ${buttonHTML}

        </div>

    `;


    grid.appendChild(
        element
    );

}



/*
==================================================
AKTUALNA CENA
==================================================
*/


function createCurrentPrice(
    price
) {


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "level current";


    element.innerHTML = `

        <div class="level-left">

            <span class="current-label">
                ● TERAZ
            </span>

        </div>


        <div class="level-price">

            <strong>
                ${formatPrice(price)}
                USDT
            </strong>

        </div>


        <div class="level-action">

            <span>
                LIVE
            </span>

        </div>

    `;


    return element;

}



/*
==================================================
TWORZENIE SIATKI
==================================================
*/


function renderGrid(
    price
) {


    if (
        price === null ||
        price === undefined
    ) {

        return;

    }


    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML = "";



    /*
    ==============================================
    SORTOWANIE OD NAJWYŻSZEJ CENY
    ==============================================
    */


    const levels =
        [...GRID_LEVELS]
            .sort(
                (a, b) =>
                    b.price - a.price
            );



    /*
    ==============================================
    DODAWANIE POZIOMÓW
    ==============================================
    */


    for (
        let i = 0;
        i < levels.length;
        i++
    ) {


        const level =
            levels[i];


        /*
        Dodaj poziom
        */


        addLevel(
            grid,
            level
        );



        /*
        ==========================================
        SPRAWDZAMY, CZY CENA JEST POMIĘDZY
        TYM POZIOMEM A NASTĘPNYM
        ==========================================
        */


        const nextLevel =
            levels[i + 1];


        if (
            nextLevel &&
            price < level.price &&
            price > nextLevel.price
        ) {


            grid.appendChild(

                createCurrentPrice(
                    price
                )

            );

        }

    }



    /*
    ==============================================
    CENA POWYŻEJ CAŁEJ SIATKI
    ==============================================
    */


    if (
        price >
        levels[0].price
    ) {


        grid.insertBefore(

            createCurrentPrice(
                price
            ),

            grid.firstChild

        );

    }



    /*
    ==============================================
    CENA PONIŻEJ CAŁEJ SIATKI
    ==============================================
    */


    if (
        price <
        levels[
            levels.length - 1
        ].price
    ) {


        grid.appendChild(

            createCurrentPrice(
                price
            )

        );

    }



    /*
    ==============================================
    NAJBLIŻSZY BUY
    ==============================================
    */


    const buys =
        levels
            .filter(
                level =>
                    level.type === "BUY" &&
                    level.price < price
            )
            .sort(
                (a, b) =>
                    b.price - a.price
            );


    const nearestBuy =
        buys.length
            ? buys[0].price
            : null;


    document.getElementById(
        "nearestBuy"
    ).textContent =

        nearestBuy !== null
            ? formatPrice(nearestBuy)
            : "---";



    /*
    ==============================================
    NAJBLIŻSZY SELL
    ==============================================
    */


    const sells =
        levels
            .filter(
                level =>
                    level.type === "SELL" &&
                    level.price > price
            )
            .sort(
                (a, b) =>
                    a.price - b.price
            );


    const nearestSell =
        sells.length
            ? sells[0].price
            : null;


    document.getElementById(
        "nearestSell"
    ).textContent =

        nearestSell !== null
            ? formatPrice(nearestSell)
            : "---";



    /*
    ==============================================
    POKAZUJEMY BAZĘ
    ==============================================
    */


    document.getElementById(
        "currentBase"
    ).textContent =

        formatPrice(
            Number(selectedBase)
        ) +
        " USDT";

}



/*
==================================================
AKTUALIZACJA DANYCH
==================================================
*/


async function update() {


    const status =
        document.getElementById(
            "status"
        );


    try {


        /*
        Pobieramy cenę
        */


        const price =
            await getPrice();


        /*
        Zapamiętujemy ją,
        żeby przy zmianie bazy
        strona mogła się odświeżyć
        bez ponownego pytania BingX.
        */


        window.lastPrice =
            price;



        /*
        Pokazujemy aktualną cenę
        */


        document.getElementById(
            "currentPrice"
        ).textContent =

            formatPrice(price)
            +
            " USDT";



        /*
        Budujemy siatkę
        */


        renderGrid(
            price
        );



        /*
        Status
        */


        status.textContent =
            "● ONLINE — BingX";


        status.className =
            "status";



        /*
        Czas aktualizacji
        */


        const now =
            new Date();


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Ostatnia aktualizacja: "
            +
            now.toLocaleTimeString();

    }


    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "● BŁĄD POŁĄCZENIA Z BINGX";


        status.className =
            "status error";


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Nie udało się pobrać ceny.";

    }

}



/*
==================================================
START
==================================================
*/


update();



/*
==================================================
ODŚWIEŻANIE CO 2 SEKUNDY
==================================================
*/


setInterval(

    update,

    2000

);


</script>


</body>

</html>
