<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SPCXB Grid</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
}


.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 20px;
}


.header {
    text-align: center;
    margin-bottom: 30px;
}


.header h1 {
    margin: 0;
    font-size: 32px;
}


.price {
    font-size: 44px;
    font-weight: bold;
    margin-top: 10px;
}


.status {
    margin-top: 8px;
    color: #3fb950;
}


.status.error {
    color: #f85149;
}


.grid {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
}


.level {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 18px;
    margin: 8px 0;

    border-radius: 8px;

    background: #21262d;

    font-size: 18px;
}


.buy {
    border-left: 5px solid #f85149;
}


.sell {
    border-left: 5px solid #3fb950;
}


.base {
    border-left: 5px solid #d29922;
    background: #252b32;
}


.current {
    border: 2px solid #58a6ff;
    background: #1f2937;
    font-weight: bold;
}


.type-buy {
    color: #f85149;
}


.type-sell {
    color: #3fb950;
}


.type-base {
    color: #d29922;
}


.current-label {
    color: #58a6ff;
}


.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 20px;
}


.stat {
    background: #161b22;

    border: 1px solid #30363d;

    border-radius: 10px;

    padding: 18px;

    text-align: center;
}


.stat-title {
    color: #8b949e;

    font-size: 14px;

    margin-bottom: 8px;
}


.stat-value {
    font-size: 20px;

    font-weight: bold;
}


.last-update {
    text-align: center;

    color: #8b949e;

    margin-top: 20px;

    font-size: 13px;
}


@media (max-width: 600px) {

    .container {
        margin: 10px auto;
        padding: 10px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .price {
        font-size: 34px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            SPCXB / USDT
        </h1>


        <div
            class="price"
            id="currentPrice"
        >
            Ładowanie...
        </div>


        <div
            class="status"
            id="status"
        >
            ● Łączenie z BingX...
        </div>

    </div>



    <div
        class="grid"
        id="grid"
    >

        <!--
            STAŁA SIATKA
            Cena z BingX zostanie
            pokazana pomiędzy poziomami.
        -->

    </div>



    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                Krok siatki
            </div>

            <div
                class="stat-value"
                id="gridStep"
            >
                4%
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Najbliższy BUY
            </div>

            <div
                class="stat-value"
                id="nearestBuy"
            >
                ---
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Najbliższy SELL
            </div>

            <div
                class="stat-value"
                id="nearestSell"
            >
                ---
            </div>

        </div>


    </div>



    <div
        class="last-update"
        id="lastUpdate"
    >
        Oczekiwanie na dane...
    </div>


</div>



<script>


/*
==================================================
STAŁA SIATKA SPCXB
==================================================

TE CENY NIE BĘDĄ SIĘ ZMIENIAĆ.

Tylko aktualna cena z BingX będzie się zmieniać.
*/


const GRID_LEVELS = [

    {
        price: 172.27,
        type: "SELL"
    },

    {
        price: 165.86,
        type: "SELL"
    },

    {
        price: 159.29,
        type: "BASE"
    },

    {
        price: 153.00,
        type: "BUY"
    },

    {
        price: 146.73,
        type: "BUY"
    },

    {
        price: 140.70,
        type: "BUY"
    },

    {
        price: 135.10,
        type: "BUY"
    },

    {
        price: 129.33,
        type: "BUY"
    },

    {
        price: 123.73,
        type: "BUY"
    },

    {
        price: 118.75,
        type: "BUY"
    },

    {
        price: 113.52,
        type: "BUY"
    },

    {
        price: 108.38,
        type: "BUY"
    }

];



/*
==================================================
POBIERANIE CENY Z BINGX
==================================================
*/


async function getPrice() {


    const response = await fetch(

        "/api/price",

        {
            cache: "no-store"
        }

    );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const json =
        await response.json();


    if (
        !json.price ||
        isNaN(json.price)
    ) {

        throw new Error(
            "Brak ceny"
        );

    }


    return Number(
        json.price
    );

}



/*
==================================================
FORMAT CENY
==================================================
*/


function formatPrice(price) {

    return Number(price)
        .toFixed(2);

}



/*
==================================================
TWORZENIE POZIOMU
==================================================
*/


function addLevel(
    grid,
    level
) {


    const element =
        document.createElement(
            "div"
        );


    /*
    SELL
    */


    if (
        level.type === "SELL"
    ) {


        element.className =
            "level sell";


        element.innerHTML = `

            <span>
                SELL
            </span>

            <strong>
                ${formatPrice(level.price)}
                USDT
            </strong>

            <span class="type-sell">
                CEL
            </span>

        `;

    }



    /*
    BASE
    */


    else if (
        level.type === "BASE"
    ) {


        element.className =
            "level base";


        element.innerHTML = `

            <span>
                BAZA
            </span>

            <strong>
                ${formatPrice(level.price)}
                USDT
            </strong>

            <span class="type-base">
                BAZA
            </span>

        `;

    }



    /*
    BUY
    */


    else {


        element.className =
            "level buy";


        element.innerHTML = `

            <span>
                BUY
            </span>

            <strong>
                ${formatPrice(level.price)}
                USDT
            </strong>

            <span class="type-buy">
                CEL
            </span>

        `;

    }


    grid.appendChild(
        element
    );

}



/*
==================================================
AKTUALNA CENA
==================================================
*/


function createCurrentPrice(price) {


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "level current";


    element.innerHTML = `

        <span class="current-label">
            ● TERAZ
        </span>

        <strong>
            ${formatPrice(price)}
            USDT
        </strong>

        <span>
            LIVE
        </span>

    `;


    return element;

}



/*
==================================================
TWORZENIE CAŁEJ SIATKI
==================================================
*/


function createGrid(price) {


    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML = "";


    /*
    ==============================================
    USTALAMY NAJBLIŻSZY BUY
    ==============================================
    */


    const buyLevels =
        GRID_LEVELS
            .filter(
                level =>
                    level.type === "BUY" &&
                    level.price < price
            )
            .sort(
                (a, b) =>
                    b.price - a.price
            );


    /*
    ==============================================
    USTALAMY NAJBLIŻSZY SELL
    ==============================================
    */


    const sellLevels =
        GRID_LEVELS
            .filter(
                level =>
                    level.type === "SELL" &&
                    level.price > price
            )
            .sort(
                (a, b) =>
                    a.price - b.price
            );


    const nearestBuy =
        buyLevels.length > 0
            ? buyLevels[0].price
            : null;


    const nearestSell =
        sellLevels.length > 0
            ? sellLevels[0].price
            : null;



    /*
    ==============================================
    SIATKA
    ==============================================
    */


    for (
        let i = 0;
        i < GRID_LEVELS.length;
        i++
    ) {


        const level =
            GRID_LEVELS[i];


        /*
        Dodajemy poziom
        */


        addLevel(
            grid,
            level
        );


        /*
        Sprawdzamy, czy aktualna
        cena znajduje się pomiędzy
        tym poziomem i kolejnym.
        */


        const nextLevel =
            GRID_LEVELS[i + 1];


        if (
            nextLevel &&
            price < level.price &&
            price > nextLevel.price
        ) {


            grid.appendChild(
                createCurrentPrice(
                    price
                )
            );

        }

    }


    /*
    ==============================================
    CENA PONAD NAJWYŻSZYM POZIOMEM
    ==============================================
    */


    if (
        price >
        GRID_LEVELS[0].price
    ) {

        grid.insertBefore(

            createCurrentPrice(
                price
            ),

            grid.firstChild

        );

    }


    /*
    ==============================================
    CENA PONIŻEJ NAJNIŻSZEGO POZIOMU
    ==============================================
    */


    if (
        price <
        GRID_LEVELS[
            GRID_LEVELS.length - 1
        ].price
    ) {

        grid.appendChild(

            createCurrentPrice(
                price
            )

        );

    }



    /*
    ==============================================
    NAJBLIŻSZY BUY
    ==============================================
    */


    document.getElementById(
        "nearestBuy"
    ).textContent =

        nearestBuy !== null
            ? formatPrice(nearestBuy)
            : "---";



    /*
    ==============================================
    NAJBLIŻSZY SELL
    ==============================================
    */


    document.getElementById(
        "nearestSell"
    ).textContent =

        nearestSell !== null
            ? formatPrice(nearestSell)
            : "---";

}



/*
==================================================
AKTUALIZACJA
==================================================
*/


async function update() {


    const status =
        document.getElementById(
            "status"
        );


    try {


        /*
        Pobieramy prawdziwą cenę
        */


        const price =
            await getPrice();


        /*
        Wyświetlamy cenę
        */


        document.getElementById(
            "currentPrice"
        ).textContent =

            formatPrice(price)
            +
            " USDT";


        /*
        Budujemy stałą siatkę
        */


        createGrid(
            price
        );


        /*
        Status
        */


        status.textContent =
            "● ONLINE — BingX";


        status.className =
            "status";


        /*
        Czas
        */


        const now =
            new Date();


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Ostatnia aktualizacja: "
            +
            now.toLocaleTimeString();


    }


    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "● BŁĄD POŁĄCZENIA Z BINGX";


        status.className =
            "status error";


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "Nie udało się pobrać ceny.";

    }

}



/*
==================================================
START
==================================================
*/


update();



/*
==================================================
ODŚWIEŻANIE CO 2 SEKUNDY
==================================================
*/


setInterval(

    update,

    2000

);


</script>


</body>

</html>
